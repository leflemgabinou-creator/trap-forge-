name: Build VST3
on:
  push:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Lister les fichiers generes
        if: always()
        shell: bash
        run: find build -name "*.vst3" -maxdepth 6
      - uses: actions/upload-artifact@v4
        with:
          name: TrapForge-VST3
          path: build/**/*.vst3
          if-no-files-found: error
